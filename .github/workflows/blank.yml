name: CI

on:
  push:
  pull_request:
    branches:
      - main
    tags: '*'
jobs:
  run_tests:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Lean matrix (2026-09): one native runner per tarball we ship, Julia at PETSc_jll's floor
        # (1.12) and at the current release ('1').  Rosetta (x64 Julia on Apple-silicon runners) and
        # nightly were dropped: they only re-test the same tarballs through emulation / an unreleased
        # Julia and are the slowest to schedule.
        include:
          - { version: '1.12', os: ubuntu-latest,  arch: x64 }
          - { version: '1',    os: ubuntu-latest,  arch: x64 }
          - { version: '1.12', os: windows-latest, arch: x64 }
          - { version: '1',    os: windows-latest, arch: x64 }
          - { version: '1',    os: macos-15-intel, arch: x64 }      # native x86_64-apple-darwin
          - { version: '1',    os: macos-14,       arch: aarch64 }  # native aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest  
        
